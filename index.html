<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 课程测试</title>
    <!-- 1. 必须引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .card {
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="mb-4 text-center">最新课程列表</h1>

        <!-- 这里是放卡片的容器 -->
        <div id="course-list" class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col-12 text-center text-muted">正在加载数据...</div>
        </div>
    </div>

    <!-- 2. 必须引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- 配置区域 ---
        const SUPABASE_URL = 'https://teuhgretiiawyjtkuzkh.supabase.co';
        // ⚠️ 请在这里粘贴你的 anon public key
        const SUPABASE_KEY = 'sb_publishable_UkBUhGy2NFbVcKB-_8-C8g_L2FPvuxt';
        // ----------------

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadCourses() {
            const listContainer = document.getElementById('course-list');

            try {
                // 发起请求
                const { data, error } = await supabase
                    .from('courses')
                    .select('*');

                if (error) throw error;

                // 清空“正在加载...”
                listContainer.innerHTML = '';

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<div class="col-12 text-center">暂无课程数据</div>';
                    return;
                }

                // 循环生成卡片
                data.forEach(course => {
                    // 处理价格显示
                    const priceTag = course.price > 0 ? `¥${course.price}` : '免费';
                    // 处理图片（如果没有图片用占位图）
                    const imgUrl = course.cover_url || 'https://via.placeholder.com/300x200?text=No+Image';

                    const cardHtml = `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <img src="${imgUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="cover">
                            <div class="card-body">
                                <h5 class="card-title">${course.title}</h5>
                                <p class="card-text text-muted small">${course.description || '暂无描述'}</p>
                            </div>
                            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                                <span class="badge bg-success fs-6">${priceTag}</span>
                                <small class="text-muted">ID: ${course.id}</small>
                            </div>
                        </div>
                    </div>
                `;
