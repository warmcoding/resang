<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resang 每日开嗓</title>
    <!-- 1. 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }

        .card {
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="mb-4 text-center"> 最新课程列表</h1>

        <!-- 课程卡片容器 -->
        <div id="course-list" class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col-12 text-center text-muted py-5">正在加载数据...</div>
        </div>
    </div>

    <!-- 2. 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- 配置区域 ---
        const SUPABASE_URL = 'https://teuhgretiiawyjtkuzkh.supabase.co';
        // ️ 请在这里粘贴你的 anon public key
        const SUPABASE_KEY = 'sb_publishable_UkBUhGy2NFbVcKB-_8-C8g_L2FPvuxt';
        // ----------------

        // 使用不同的变量名（sbClient），彻底避免 Identifier 'supabase' has already been declared 报错
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadCourses() {
            const listContainer = document.getElementById('course-list');

            try {
                // 发起请求获取 courses 表数据
                const { data, error } = await sbClient
                    .from('courses')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // 清空“正在加载...”提示
                listContainer.innerHTML = '';

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<div class="col-12 text-center">暂无课程数据</div>';
                    return;
                }

                // 循环生成卡片
                data.forEach(course => {
                    const priceTag = course.price > 0 ? `¥${course.price}` : '免费';
                    const imgUrl = course.cover_url || 'https://via.placeholder.com/300x200?text=No+Image';

                    const cardHtml = `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <img src="${imgUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="cover">
                            <div class="card-body">
                                <h5 class="card-title">${course.title}</h5>
                                <p class="card-text text-muted small">${course.description || '暂无描述'}</p>
                            </div>
                            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                                <span class="badge bg-success fs-6">${priceTag}</span>
                                <small class="text-muted">ID: ${course.id}</small>
                            </div>
                        </div>
                    </div>
                `;
                    listContainer.innerHTML += cardHtml;
                });

            } catch (err) {
                console.error('出错了:', err);
                listContainer.innerHTML = `<div class="col-12 text-danger text-center">加载失败: ${err.message}</div>`;
            }
        }

        // 页面加载完立即执行
        loadCourses();
    </script>

</body>

</html>
